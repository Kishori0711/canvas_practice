<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flow 3D Text</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: Poppins, ui-sans-serif, system-ui, sans-serif; }
    #stage { perspective: 1100px; }
    #text { transform-style: preserve-3d; will-change: transform; }
  </style>
</head>
<body class="bg-black text-white overflow-hidden h-screen select-none">

  <canvas id="flow" class="fixed inset-0 w-full h-full"></canvas>

  <div id="stage" class="fixed inset-0 pointer-events-none">
    <canvas id="text" class="w-full h-full"></canvas>
  </div>

  <header class="fixed top-5 left-6 z-10">
    <p class="text-xs tracking-[0.4em] uppercase text-white/50">Canvas Practice</p>
    <h1 class="text-lg font-semibold text-white/90">Flow Field × 3D Text</h1>
  </header>

  <p class="fixed top-6 right-6 z-10 text-xs text-white/40 hidden md:block">Mouse hilao — text tilt hoga, flow ghoomega</p>

  <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-10 w-[min(94vw,760px)]">
    <div class="flex flex-wrap items-center justify-center gap-3 px-5 py-4 rounded-2xl border border-white/10 bg-white/5 backdrop-blur-xl shadow-2xl">
      <input id="text-input" type="text" maxlength="12" value="CANVAS"
        class="w-40 px-3 py-2 rounded-lg bg-black/40 border border-white/15 text-sm font-semibold tracking-widest uppercase outline-none focus:border-white/40"
        placeholder="Apna text" />
      <div id="palettes" class="flex items-center gap-2"></div>
      <button id="shuffle" class="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-sm font-semibold transition">Shuffle Flow</button>
      <button id="save" class="px-4 py-2 rounded-lg bg-white text-black hover:scale-105 text-sm font-semibold transition">Save PNG</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
